--- config/master.conf.orig
+++ config/master.conf
@@ -59,8 +59,8 @@
 work_dir="/var/lib/clamav-unofficial-sigs"   #Top level working directory
 
 # Log update information to '$log_file_path/$log_file_name'.
-logging_enabled="yes"
-log_file_path="/var/log/clamav-unofficial-sigs"
